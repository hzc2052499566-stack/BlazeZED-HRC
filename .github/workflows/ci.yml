name: Portable CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-tests:
    name: Windows / Python 3.11 / portable suite
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.2"
          cache: pip
          cache-dependency-path: requirements/ci.txt

      - name: Install portable CI dependencies
        run: python -m pip install -r requirements/ci.txt

      - name: Compile Python sources
        run: python -m compileall -q tools tests

      - name: Run audited portable suite
        run: python tests/portable_suite.py

      - name: Run supplemental research-component suite
        run: python tests/research_components_suite.py
